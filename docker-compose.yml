version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nm-ai
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: postgresql://nmai:nmaipassword@postgres:5432/nmaidb
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped
    networks:
      - nm-ai-network

  ollama:
    image: ollama/ollama:latest
    container_name: nm-ai-ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    networks:
      - nm-ai-network

  postgres:
    image: postgres:16-alpine
    container_name: nm-ai-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=nmai
      - POSTGRES_PASSWORD=nmaipassword
      - POSTGRES_DB=nmaidb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nmai -d nmaidb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nm-ai-network

networks:
  nm-ai-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
